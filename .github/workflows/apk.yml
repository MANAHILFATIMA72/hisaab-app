# Builds a test APK on GitHub's own machines (no Expo queue) and publishes it
# as a GitHub release, so it can be downloaded straight to a phone.
# Signed with the debug key: fine for testing, not for Google Play.
name: Test APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # arm64 only: covers nearly every phone sold in the last 6+ years and halves build time.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk hisaab-$tag.apk
          gh release create "$tag" hisaab-$tag.apk --prerelease --title "Hisaab test build ${{ github.run_number }}" \
            --notes "Test APK built from ${GITHUB_SHA::7}. Download the .apk on your phone and install it."
