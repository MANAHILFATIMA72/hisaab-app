# Builds the app for the emulator (x86_64), opens it on an Android emulator and saves the
# crash log and a screenshot. Same code and settings as the Test APK, only a different CPU type.
name: Crash check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: android
        env:
          EXPO_PUBLIC_TEST_ADS: '1'
      - run: cp android/app/build/outputs/apk/release/app-release.apk app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.manahil.hisaab -c android.intent.category.LAUNCHER 1
            sleep 25
            bash scripts/emulator-tap.sh "Next" "Student" "Next" "Start using Hisaab" "Allow"
            sleep 40
            adb logcat -d > logcat.txt || true
            adb shell pidof com.manahil.hisaab || echo "APP NOT RUNNING" >> logcat.txt
            adb exec-out screencap -p > screen.png || true
      - name: Crash summary
        if: always()
        run: |
          grep -n -A30 "FATAL EXCEPTION" logcat.txt | head -80 || true
          grep -n "\[ads\]\|\[tap\]\|APP NOT RUNNING\|Ads    \|UserMessagingPlatform" logcat.txt | head -80 || true
          echo "--- crash signs ---"
          grep -n "AndroidRuntime\|E ReactNativeJS\|ReactNativeJS.*rror\|Fatal signal\|ANR in\|has died\|com.manahil.hisaab.*died\|backtrace\|Abort message" logcat.txt | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-check-${{ github.run_number }}
          path: |
            logcat.txt
            screen.png
