# Builds the Android app on Expo's servers (EAS). Run it from the Actions tab.
# Needs a repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = installable APK for testing, production = .aab for Google Play'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Links this repo to the Expo project (creates it on the first run).
      - run: eas init --non-interactive --force
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
